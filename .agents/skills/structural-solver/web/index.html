<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>结构静力 · 浏览器求解原型</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; background: #f4f7fa; color: #182c40; margin: 0; }
    main { max-width: 800px; margin: 6vh auto; padding: 0 24px; }
    h1 { margin-bottom: .25em; } p { color: #506478; }
    section { background: white; border: 1px solid #dbe5ee; border-radius: 12px; padding: 24px; margin: 20px 0; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input { max-width: 100%; } button { background: #1766ad; color: white; border: 0; border-radius: 6px; padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 20px 8px 0 0; }
    button:disabled { background: #9daeba; cursor: default; } pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .notice { border-left: 4px solid #e5a72e; padding-left: 12px; } a { color: #1766ad; }
  </style>
</head>
<body><main>
  <h1>浏览器结构静力求解</h1>
  <p>WebGPU 线性方程原型 · 所有计算在本机进行</p>
  <section>
    <p class="notice">研究原型：导入由本项目导出的有限元方程，使用 GPU 计算稀疏矩阵乘法。请与双精度参考结果核对，暂勿用于工程定型。</p>
    <label for="input">有限元方程 JSON</label>
    <input id="input" type="file" accept=".json,application/json">
    <label for="case">本地示例</label>
    <select id="case"><option value="example.json">拉伸杆</option><option value="example-bending.json">悬臂梁弯曲</option></select>
    <label for="tolerance">相对残差目标</label>
    <input id="tolerance" type="number" value="0.00001" min="0.0000001" max="0.1" step="any">
    <label for="iterations">最大迭代次数</label>
    <input id="iterations" type="number" value="3000" min="1" max="10000" step="1">
    <label for="preconditioner">预条件器</label>
    <select id="preconditioner"><option value="jacobi">Jacobi</option><option value="block-jacobi">节点 3×3 块 Jacobi</option></select>
    <div><button id="example">载入示例</button><button id="solve" disabled>开始求解</button><button id="download" disabled>下载位移 JSON</button></div>
  </section>
  <section><strong>状态与结果</strong><pre id="result" role="status" aria-live="polite">请选择方程文件。</pre></section>
</main><script type="module" src="./app.js"></script></body></html>
